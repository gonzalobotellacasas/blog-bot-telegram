name: Keepalive

on:
  schedule:
    - cron: '0 5 1,15 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows (resets the 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable run_bot.yml --repo ${{ github.repository }}
          gh workflow enable keepalive.yml --repo ${{ github.repository }}
